name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_name: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch_name: aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-all-crates: "true"

      - name: Install cross toolchain
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive & compute checksums
        shell: bash
        run: |
          mkdir -p dist
          SRC_BIN="target/${{ matrix.target }}/release/deeperseeker"
          cp "${SRC_BIN}" deeperseeker
          tar -czf "dist/deeperseeker-${{ matrix.arch_name }}-linux.tar.gz" deeperseeker templates static wasm assets
          cd dist
          sha256sum "deeperseeker-${{ matrix.arch_name }}-linux.tar.gz" > "deeperseeker-${{ matrix.arch_name }}-linux.tar.gz.sha256"

      - name: Upload archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

{% extends "base.html" %}
{% block title %}Sign In — DeeperSeeker{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
            <span class="brand-kanji" style="font-size: 1.5rem;">深索</span>
            <span class="auth-title" style="margin: 0;">DeeperSeeker</span>
        </div>
        <p class="auth-desc">Sign in to access your proxy pool & analytics dashboard.</p>

        {% if error %}
        <div class="alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="auth-form">
            <input type="text" name="username" class="input-field" placeholder="Admin Username" required autocomplete="username">
            <input type="password" name="password" class="input-field" placeholder="Admin Password" required autocomplete="current-password">
            <button type="submit" class="btn-primary" style="margin-top: 0.5rem; width: 100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}

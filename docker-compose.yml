services:
  deeperseeker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/praveensenpai/deeperseeker-rs:latest
    container_name: deeperseeker
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DEEPSEEKER_HOST=0.0.0.0
      - DEEPSEEKER_PORT=4000
      - DEEPSEEKER_API_KEY=dseeker
      - DEEPSEEKER_ADMIN_USER=admin
      - DEEPSEEKER_ADMIN_PASS=admin
      - DEEPSEEKER_DB_PATH=/data/deeperseeker.db
      - DEEPSEEKER_REQUEST_GAP=5.0
      - RUST_LOG=info
    volumes:
      - deeperseeker_data:/data

# The data volume is managed manually (created by the documented `docker run`
# command), so it is referenced as external. Compose will attach to it instead
# of trying to create and own it, which keeps tokens and usage history safe
# across `docker compose up` / `down` cycles.
volumes:
  deeperseeker_data:
    name: deeperseeker_data
    external: true
